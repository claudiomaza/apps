<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#203c35">
  <meta name="description" content="Agenda compartida: consultá, creá y organizá eventos.">
  <title>Agenda — Apps</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="manifest" href="./manifest.json">
</head>
<body>
  <header class="topbar"><a class="brand" href="./">A / Agenda</a><span id="connection" class="connection">Conectando…</span></header>
  <main class="layout">
    <section class="intro"><p class="eyebrow">ORGANIZACIÓN · AGENDA</p><h1>Los días, <em>en orden.</em></h1><p>Un espacio claro para planificar y compartir eventos.</p></section>
    <section class="toolbar" aria-label="Controles del calendario">
      <button id="prev" class="icon-button" aria-label="Mes anterior">←</button><h2 id="month-label"></h2><button id="next" class="icon-button" aria-label="Mes siguiente">→</button>
      <button id="today" class="quiet-button">Hoy</button><button id="new-event" class="primary-button">＋ Nuevo evento</button>
    </section>
    <section class="calendar" aria-label="Calendario mensual"><div class="weekdays"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div><div id="grid" class="grid"></div></section>
    <section class="agenda"><div class="section-heading"><div><p class="eyebrow">PRÓXIMAMENTE</p><h2>Agenda del mes</h2></div><button id="refresh" class="quiet-button">Actualizar</button></div><div id="events" class="event-list"><div class="empty">Cargando eventos…</div></div></section>
  </main>
  <dialog id="event-dialog"><form id="event-form" method="dialog"><div class="dialog-head"><div><p class="eyebrow">NUEVO EVENTO</p><h2>¿Qué tenemos?</h2></div><button type="button" class="icon-button" id="close-dialog" aria-label="Cerrar">×</button></div><label>Título<input name="title" required maxlength="160" placeholder="Reunión de equipo"></label><div class="two-col"><label>Fecha<input name="date" type="date" required></label><label>Hora<input name="time" type="time" value="09:00" required></label></div><label>Lugar <span class="optional">opcional</span><input name="location" maxlength="160" placeholder="Sala o enlace"></label><label>Descripción <span class="optional">opcional</span><textarea name="description" rows="3" maxlength="1000"></textarea></label><div class="form-actions"><button type="button" class="quiet-button" id="cancel">Cancelar</button><button class="primary-button" type="submit">Guardar evento</button></div></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./config.js"></script><script src="./app.js" defer></script>
</body>
</html>
