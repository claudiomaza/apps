<!doctype html><html><head><base target="_top"><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172027;background:#f4f7f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}.shell{max-width:1100px;margin:auto;padding:28px 18px 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{font-size:1.45rem;font-weight:750;letter-spacing:-.04em}.sub{color:#63727b;margin-top:5px;font-size:.92rem}.panel{background:#fff;border:1px solid #dde5e8;border-radius:16px;padding:22px;box-shadow:0 8px 28px #1c34400b;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:.86rem;font-weight:650;color:#33434b}input,select{font:inherit;width:100%;border:1px solid #cbd6db;border-radius:9px;padding:11px 12px;min-height:44px;background:#fff;color:#172027}input:focus,select:focus{outline:3px solid #b8e4dc;border-color:#168975}button,.button{font:inherit;font-weight:650;border:0;border-radius:9px;padding:12px 14px;min-height:44px;background:#087e69;color:white;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}button.secondary,.button.secondary{background:#e9f1f1;color:#173b37}button.danger{background:#fff0ed;color:#a53423}button:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.table-wrap{overflow:auto;border:1px solid #e4eaec;border-radius:10px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f1;font-size:.9rem}th{background:#f7f9f9;color:#4e5c63;position:sticky;top:0}tr:last-child td{border-bottom:0}.notice{padding:12px 14px;border-radius:10px;background:#edf6f4;color:#214f46;margin:12px 0}.notice.error{background:#fff0ed;color:#8b2e20}.muted{color:#64737b}.hidden{display:none!important}.user-row{display:grid;grid-template-columns:minmax(180px,1fr) 140px 110px auto;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #edf0f1}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#e9f1f1;font-size:.78rem}.tag.off{background:#fff0ed;color:#8b2e20}.small{font-size:.84rem}.danger-zone{border-left:3px solid #e0a397;padding-left:12px;color:#6b5550}@media(max-width:680px){.shell{padding:19px 13px 40px}.panel{padding:16px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top,.toolbar{align-items:flex-start;flex-direction:column}.user-row{grid-template-columns:1fr 1fr}.user-row .email{grid-column:1/-1}.user-row .actions{grid-column:1/-1}}
</style></head><body>
<main class="shell"><header class="top"><div><div class="brand">Registro Único</div><div class="sub" id="identity">Verificando tu cuenta de Google…</div></div><a id="adminLink" class="button secondary hidden" href="?page=admin">Administración</a></header>
<div id="notice" class="notice hidden" role="status"></div>
<section id="app" class="hidden">
  <form id="recordForm" class="panel"><div class="toolbar"><div><strong id="formTitle">Nuevo registro</strong><div class="sub">Los registros nuevos se agregan al final.</div></div><button id="saveButton" type="submit">Guardar registro</button></div>
    <input type="hidden" id="recordId"><div class="grid">
      <div class="field"><label for="nombre">Nombre</label><input id="nombre" maxlength="80" required autocomplete="given-name"></div>
      <div class="field"><label for="apellido">Apellido</label><input id="apellido" maxlength="80" required autocomplete="family-name"></div>
      <div class="field"><label for="dni">DNI</label><input id="dni" maxlength="80" required inputmode="numeric"></div>
      <div class="field"><label for="escolaridad">Escolaridad</label><input id="escolaridad" maxlength="160" required></div>
    </div><div class="actions" style="margin-top:14px"><button class="secondary hidden" id="cancelEdit" type="button">Cancelar edición</button></div>
  </form>
  <section class="panel"><div class="toolbar"><div><strong>Registros</strong><div class="sub" id="recordCount">Cargando…</div></div><button id="refresh" class="secondary" type="button">Actualizar</button></div>
    <p class="small muted">En pantallas angostas, desplazá la tabla horizontalmente para ver todas las columnas y acciones.</p><div class="table-wrap" aria-label="Tabla desplazable de registros"><table><thead><tr><th>Nombre</th><th>Apellido</th><th>DNI</th><th>Escolaridad</th><th>Acciones</th></tr></thead><tbody id="records"></tbody></table></div>
  </section>
</section></main>
<script>
(function(){
  var notice=document.getElementById('notice'),records=[];
  function show(message,error){notice.textContent=message;notice.className='notice'+(error?' error':'');}
  function fail(error){show(error&&error.message?error.message:'No se pudo completar la operación.',true);}
  function call(name,args,done){var runner=google.script.run.withSuccessHandler(done||function(){}).withFailureHandler(fail);runner[name].apply(runner,args||[]);}
  function reset(){document.getElementById('recordForm').reset();document.getElementById('recordId').value='';document.getElementById('formTitle').textContent='Nuevo registro';document.getElementById('saveButton').textContent='Guardar registro';document.getElementById('cancelEdit').classList.add('hidden');}
  function refresh(){call('apiListRecords',[],function(rows){records=rows;var body=document.getElementById('records');body.replaceChildren();rows.forEach(function(r){var tr=document.createElement('tr');[r.nombre,r.apellido,r.dni,r.escolaridad].forEach(function(v){var td=document.createElement('td');td.textContent=v;tr.appendChild(td);});var td=document.createElement('td'),wrap=document.createElement('div');wrap.className='actions';var edit=document.createElement('button');edit.type='button';edit.className='secondary';edit.textContent='Editar';edit.setAttribute('aria-label','Editar registro de '+r.nombre+' '+r.apellido);edit.addEventListener('click',function(){document.getElementById('recordId').value=r.id;['nombre','apellido','dni','escolaridad'].forEach(function(k){document.getElementById(k).value=r[k];});document.getElementById('formTitle').textContent='Editar registro';document.getElementById('saveButton').textContent='Guardar cambios';document.getElementById('cancelEdit').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});});var del=document.createElement('button');del.type='button';del.className='danger';del.textContent='Eliminar';del.setAttribute('aria-label','Eliminar registro de '+r.nombre+' '+r.apellido);del.addEventListener('click',function(){if(confirm('¿Eliminar este registro? Esta acción no se puede deshacer.'))call('apiDeleteRecord',[r.id],function(){show('Registro eliminado.');refresh();});});wrap.append(edit,del);td.appendChild(wrap);tr.appendChild(td);body.appendChild(tr);});document.getElementById('recordCount').textContent=rows.length+' registro'+(rows.length===1?'':'s');});}
  document.getElementById('recordForm').addEventListener('submit',function(e){e.preventDefault();var b=document.getElementById('saveButton');b.disabled=true;var input={id:document.getElementById('recordId').value,nombre:document.getElementById('nombre').value,apellido:document.getElementById('apellido').value,dni:document.getElementById('dni').value,escolaridad:document.getElementById('escolaridad').value};call('apiSaveRecord',[input],function(){b.disabled=false;show('Registro guardado.');reset();refresh();});});
  document.getElementById('cancelEdit').addEventListener('click',reset);document.getElementById('refresh').addEventListener('click',refresh);
  call('apiBootstrap',[],function(ctx){document.getElementById('identity').textContent=ctx.email||'';if(!ctx.ok){show(ctx.message,true);return;}if(!ctx.spreadsheetConfigured){show('Falta vincular esta planilla. Volvé a Sheets y usá el menú Registro Único para vincularla.',true);if(ctx.isAdmin)document.getElementById('adminLink').classList.remove('hidden');return;}document.getElementById('app').classList.remove('hidden');if(ctx.isAdmin)document.getElementById('adminLink').classList.remove('hidden');refresh();});
})();
</script></body></html>
